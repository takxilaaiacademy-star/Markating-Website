<!doctype html><html><head><meta charset="utf-8"><link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;700;800&display=swap" rel="stylesheet"><style>
*{box-sizing:border-box;margin:0}body{width:1125px;height:330px;overflow:hidden;font-family:'Plus Jakarta Sans',sans-serif;color:#fff;
background:radial-gradient(420px 260px at 560px 360px,rgba(37,99,235,.55),transparent 70%),radial-gradient(380px 300px at 1100px -40px,rgba(16,185,129,.45),transparent 70%),linear-gradient(100deg,#0b1222,#0e1a33 60%,#0b1a26);position:relative}
body:before{content:"";position:absolute;inset:0;background-image:radial-gradient(rgba(255,255,255,.07) 1px,transparent 1px);background-size:14px 14px}
.l{position:absolute;left:40px;top:26px}.brand{display:flex;align-items:center;gap:12px;font-weight:800;letter-spacing:.18em;font-size:15px}.brand img{width:28px}
.chip{display:inline-block;margin-top:22px;padding:6px 14px;border:1px solid rgba(255,255,255,.25);border-radius:99px;background:rgba(255,255,255,.08);color:#6ee7b7;font-weight:800;letter-spacing:.1em;font-size:12px}
h1{margin-top:12px;font-size:34px;line-height:1.08;font-weight:800;letter-spacing:-.02em}h1 span{color:#34d399}
p{margin-top:8px;color:#c3cbe0;font-size:14px}
.row{position:absolute;left:40px;bottom:26px;display:flex;gap:12px}.free{background:#fbbf24;color:#111;font-weight:800;font-size:24px;padding:8px 18px;border-radius:10px}.dur{border:1px solid rgba(255,255,255,.3);border-radius:10px;padding:10px 16px;font-weight:700;font-size:16px;display:flex;align-items:center;gap:8px}
.card{position:absolute;right:46px;top:30px;width:420px;height:270px;background:#fff;border-radius:16px;color:#111827;padding:20px 22px;box-shadow:0 20px 60px rgba(0,0,0,.4)}
.nm{font-weight:800;font-size:18px}.jb{color:#6b7280;font-size:12px;margin-top:2px}.hd{margin-top:12px;font-size:10px;font-weight:800;letter-spacing:.1em;color:#2563eb;border-bottom:1px solid #e5e7eb;padding-bottom:3px}
.ln{height:7px;border-radius:4px;background:#e5e7eb;margin-top:7px}.kw{display:inline-block;background:#d1fae5;color:#047857;font-size:10px;font-weight:700;border-radius:99px;padding:2px 8px;margin:6px 4px 0 0}
.score{position:absolute;right:16px;top:16px;width:74px;height:74px;border-radius:50%;background:conic-gradient(#10b981 0 92%,#e5e7eb 0);display:grid;place-items:center}.score div{width:58px;height:58px;border-radius:50%;background:#fff;display:grid;place-items:center;text-align:center;font-weight:800;font-size:18px;line-height:1}.score small{display:block;font-size:8px;color:#6b7280;letter-spacing:.06em}
</style></head><body>
<div class="l"><div class="brand"><img src="../../public/assets/logo-mark-dark.webp">TAKXILA ™</div><div class="chip">FREE TOOL</div>
<h1>ATS-Friendly<br><span>Resume Builder</span></h1><p>Tailored to the job description. Ready for recruiters.</p></div>
<div class="row"><div class="free">FREE</div><div class="dur">⬇ .docx + PDF</div></div>
<div class="card"><div class="nm">Riya Sharma</div><div class="jb">Marketing Analyst · Pune</div>
<div class="score"><div>92<small>ATS</small></div></div>
<div class="hd">SUMMARY</div><div class="ln" style="width:72%"></div><div class="ln" style="width:70%"></div>
<div class="hd">EXPERIENCE</div><div class="ln" style="width:80%"></div><div class="ln" style="width:60%"></div>
<div class="hd">SKILLS</div><span class="kw">Google Analytics</span><span class="kw">SEO</span><span class="kw">SQL</span><span class="kw">A/B testing</span></div>
</body></html>
