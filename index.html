<!doctype html>

  <link rel="manifest" href="/manifest.webmanifest" />
  <meta property="og:site_name" content="Takxila AI Academy" />

  <link rel="canonical" href="%SITE_URL%/" />

  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" />
  <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "EducationalOrganization",
      "name": "Takxila AI Academy",
      "alternateName": "TAKXILA",
      "url": "%SITE_URL%",
      "logo": "%SITE_URL%/icon-512.png",
      "slogan": "Master the AI frameworks. Own the AI future.",
      "email": "support@takxila.in",
      "telephone": "+91-72766-07776",
      "contactPoint": { "@type": "ContactPoint", "contactType": "customer support", "telephone": "+91-72766-07776", "email": "support@takxila.in", "areaServed": "IN", "availableLanguage": ["English", "Hindi"] }
    }
  </script>
  <style>
    .tx-boot { position: fixed; inset: 0; display: grid; place-content: center; justify-items: center; gap: 14px; font-family: 'Plus Jakarta Sans', system-ui, sans-serif; background: #0a1022; color: #c0c7de; }
    html[data-theme='light'] .tx-boot { background: #eef1fb; color: #4b5470; }
    .tx-boot-ring { width: 64px; height: 64px; border-radius: 50%; border: 3px solid rgba(245, 185, 63, 0.2); border-top-color: #f5b93f; animation: txbootspin 0.9s linear infinite; }
    .tx-boot p { margin: 0; font-weight: 600; }
    @keyframes txbootspin { to { transform: rotate(360deg); } }
  </style>
  <script>
    try { if (JSON.parse(localStorage.getItem('tx_theme')) === 'light') document.documentElement.dataset.theme = 'light'; } catch (e) { }
  </script>
</head>
<body>
  <div id="root">
    <div class="tx-boot" role="status" aria-label="Loading">
      <div class="tx-boot-ring"></div>
      <p>Takxila AI Academy</p>
    </div>
  </div>
  <noscript>Takxila AI Academy: practical AI courses. Please turn on JavaScript to browse the courses.</noscript>
  <script type="module" src="/src/main.tsx"></script>
</body>
</html>
